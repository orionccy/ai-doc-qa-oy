# ============ Nginx 配置:前端静态托管 + API 反向代理 ============
server {
    listen 80;
    server_name _;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由回退:刷新 /chat 等路径时返回 index.html(由前端路由接管)
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器(docker compose 网络内用服务名访问)
    location /api/ {
        proxy_pass http://ai-doc-qa:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 关键:SSE 流式输出必须关闭缓冲,否则打字机效果会卡住
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
